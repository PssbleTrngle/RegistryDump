modLoader = "javafml"
loaderVersion = "[47,)"
license = "https://github.com/${repository}/blob/HEAD/LICENSE.md"
issueTrackerURL = "https://github.com/${repository}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
updateJSONURL = "https://api.modrinth.com/updates/registry-dump/forge_updates.json"
displayName = "${mod_name}"
authors = "${mod_author}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_version_range}"
ordering = "NONE"
side = "BOTH"
